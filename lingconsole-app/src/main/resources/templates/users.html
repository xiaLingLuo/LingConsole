<!DOCTYPE html>
<html lang="zh-CN">
<head th:replace="~{layout :: head('用户管理')}"></head>
<body>

<th:block th:replace="~{layout :: sidebar('users')}"></th:block>

<main class="lc-main">
    <header class="lc-header">
        <h1 class="lc-header__title">用户管理</h1>
        <div class="lc-header__actions">
            <button class="lc-btn" id="btn-groups">权限组管理</button>
            <button class="lc-btn lc-btn--primary" id="btn-add-user">+ 新建用户</button>
        </div>
    </header>

    <section class="lc-content">
        <div class="lc-card">
            <div class="lc-card__body lc-card__body--flush">
                <table class="lc-table">
                    <thead>
                    <tr>
                        <th>用户名</th>
                        <th>角色</th>
                        <th>创建时间</th>
                        <th style="width:260px">操作</th>
                    </tr>
                    </thead>
                    <tbody id="user-tbody">
                    <tr><td colspan="4" class="lc-table__empty">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>


<div class="lc-modal-mask" id="user-modal" style="display:none">
    <div class="lc-modal">
        <div class="lc-modal__header">
            <h2 class="lc-modal__title" id="user-modal-title">新建用户</h2>
            <button class="lc-modal__close" id="btn-close-user-modal">×</button>
        </div>
        <div class="lc-modal__body">
            <div class="lc-form__group">
                <label class="lc-form__label">用户名</label>
                <input class="lc-input" type="text" id="user-username" placeholder="请输入用户名">
            </div>
            <div class="lc-form__group">
                <label class="lc-form__label">密码</label>
                <input class="lc-input" type="password" id="user-password" placeholder="至少 6 位, 编辑时留空则不修改">
            </div>
            <div class="lc-form__group" id="user-groups-wrap">
                <label class="lc-form__label">所属权限组</label>
                <div id="user-groups-box" class="lc-perm-box">加载中...</div>
            </div>
            <div class="lc-form__error" id="user-error"></div>
        </div>
        <div class="lc-modal__footer">
            <button class="lc-btn" id="btn-cancel-user-modal">取消</button>
            <button class="lc-btn lc-btn--primary" id="btn-save-user">保存</button>
        </div>
    </div>
</div>


<div class="lc-modal-mask" id="perm-modal" style="display:none">
    <div class="lc-modal lc-modal--wide">
        <div class="lc-modal__header">
            <h2 class="lc-modal__title" id="perm-modal-title">用户权限</h2>
            <button class="lc-modal__close" id="btn-close-perm-modal">×</button>
        </div>
        <div class="lc-modal__body">
            <div class="lc-form__group">
                <label class="lc-form__label">所属权限组</label>
                <div id="perm-groups-box" class="lc-perm-box"></div>
            </div>
            <div class="lc-form__error" id="perm-error"></div>
        </div>
        <div class="lc-modal__footer">
            <button class="lc-btn" id="btn-cancel-perm-modal">取消</button>
            <button class="lc-btn lc-btn--primary" id="btn-save-perm">保存</button>
        </div>
    </div>
</div>


<div class="lc-modal-mask" id="groups-modal" style="display:none">
    <div class="lc-modal lc-modal--wide">
        <div class="lc-modal__header">
            <h2 class="lc-modal__title">权限组管理</h2>
            <button class="lc-modal__close" id="btn-close-groups-modal">×</button>
        </div>
        <div class="lc-modal__body" id="groups-list"></div>
        <div class="lc-modal__footer">
            <button class="lc-btn" id="btn-close-groups-modal2">关闭</button>
            <button class="lc-btn lc-btn--primary" id="btn-add-group">+ 新建权限组</button>
        </div>
    </div>
</div>


<div class="lc-modal-mask" id="group-modal" style="display:none">
    <div class="lc-modal lc-modal--wide">
        <div class="lc-modal__header">
            <h2 class="lc-modal__title" id="group-modal-title">编辑权限组</h2>
            <button class="lc-modal__close" id="btn-close-group-modal">×</button>
        </div>
        <div class="lc-modal__body">
            <div class="lc-form__group">
                <label class="lc-form__label">权限组 ID (仅小写英文字母)</label>
                <input class="lc-input" type="text" id="group-groupid" placeholder="如: ops">
            </div>
            <div class="lc-form__group">
                <label class="lc-form__label">名称 (友好别名, 可中文)</label>
                <input class="lc-input" type="text" id="group-name" placeholder="如: 运维权限">
            </div>
            <div class="lc-form__group">
                <label class="lc-form__label">描述</label>
                <input class="lc-input" type="text" id="group-desc" placeholder="描述 (可选)">
            </div>
            <div class="lc-form__group">
                <label class="lc-form__label">权限</label>
                <div id="group-perms-box" class="lc-perm-box"></div>
            </div>
            <div class="lc-form__error" id="group-error"></div>
        </div>
        <div class="lc-modal__footer">
            <button class="lc-btn" id="btn-cancel-group-modal">取消</button>
            <button class="lc-btn lc-btn--primary" id="btn-save-group">保存</button>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: footerScripts}"></th:block>
<script src="/static/js/pages/page-users.js"></script>
</body>
</html>
